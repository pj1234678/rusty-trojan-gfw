[package]
name = "rustytrojan"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"

[dev-dependencies]
rcgen = "0.11"
tokio = { version = "1.0", features = ["full", "test-util"] }

[[bench]]
name = "throughput"
harness = false